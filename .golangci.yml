version: "2"

run:
  tests: true

linters:
  enable:
    - funlen
    - goconst
    - gocritic
    - misspell
    - unconvert
    - unparam

  settings:
    errcheck:
      check-type-assertions: true

    funlen:
      lines: 120
      statements: 70

    goconst:
      min-occurrences: 4

    gocritic:
      disabled-checks:
        - ifElseChain
      enabled-checks:
        - boolExprSimplify
        - unnamedResult

  exclusions:
    generated: lax

    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      - linters:
          - dupl
          - funlen
          - gocyclo
          - goconst
        path: _test\.go

    paths:
      - bin
      - .cache
      - build

issues:
  max-issues-per-linter: 50
  max-same-issues: 3

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/space-armada/nitipan

  exclusions:
    generated: lax
    paths:
      - bin
      - .cache
      - build
